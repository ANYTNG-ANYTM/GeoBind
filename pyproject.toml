[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geobind"
version = "1.0.0"
description = "Production-ready ML pipeline for protein-ligand binding affinity prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GeoBind Team"}
]

dependencies = [
    "biopython>=1.80",
    "rdkit>=2022.09",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "scipy>=1.10",
    "fastapi>=0.95",
    "uvicorn[standard]>=0.21",
    "streamlit>=1.19",
    "plotly>=5.12",
    "joblib>=1.2",
    "python-multipart>=0.0.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
geobind-api = "src.api.phase4_api_service:main"
geobind-ui = "src.ui.phase5_web_frontend:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
